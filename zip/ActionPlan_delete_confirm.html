{% extends './base.html' %}
{% block content %}
<style>
    .delete-container {
        max-width: 550px;
        margin: 100px auto;
        padding: 20px;
    }
    
    .delete-card {
        background: linear-gradient(135deg, rgba(244, 67, 54, 0.08) 0%, rgba(244, 67, 54, 0.02) 100%);
        border: 1px solid rgba(244, 67, 54, 0.25);
        border-radius: 16px;
        padding: 50px 40px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    .delete-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #f44336, transparent);
        animation: scanLine 3s linear infinite;
    }
    
    @keyframes scanLine {
        0% {
            left: -100%;
        }
        100% {
            left: 100%;
        }
    }
    
    .warning-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 25px;
        background: rgba(244, 67, 54, 0.15);
        border: 2px solid rgba(244, 67, 54, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #f44336;
    }
    
    .delete-title {
        font-size: 1.4rem;
        font-weight: 300;
        color: #e0e0e0;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }
    
    .plan-name {
        font-size: 1.5rem;
        color: #ffffff;
        margin-bottom: 10px;
        font-weight: 400;
        line-height: 1.4;
    }
    
    .warning-text {
        font-size: 0.85rem;
        color: #888888;
        margin-bottom: 40px;
    }
    
    .button-group {
        display: flex;
        gap: 15px;
        justify-content: center;
    }
    
    .btn-delete {
        background-color: #f44336;
        color: #ffffff;
        border: none;
        padding: 14px 45px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .btn-delete::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.2);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    
    .btn-delete:hover::before {
        width: 300px;
        height: 300px;
    }
    
    .btn-delete:hover {
        background-color: #d32f2f;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
    }
    
    .btn-delete span {
        position: relative;
        z-index: 1;
    }
    
    .btn-cancel {
        background-color: transparent;
        color: #a0a0a0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 14px 45px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 1rem;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }
    
    .btn-cancel:hover {
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.4);
        background-color: rgba(255, 255, 255, 0.05);
    }
    
    /* ローディング画面 */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeIn 0.3s ease-out;
    }
    
    .loading-overlay.active {
        display: flex;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
    
    .loading-content {
        text-align: center;
    }
    
    .loading-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 25px;
        border: 3px solid rgba(244, 67, 54, 0.2);
        border-top: 3px solid #f44336;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
    
    .loading-text {
        font-size: 1.1rem;
        color: #b0b0b0;
        letter-spacing: 1px;
    }
    
    .loading-dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
    }
    
    @keyframes dots {
        0%, 20% {
            content: '';
        }
        40% {
            content: '.';
        }
        60% {
            content: '..';
        }
        80%, 100% {
            content: '...';
        }
    }
    
    @media (max-width: 768px) {
        .delete-card {
            padding: 40px 25px;
        }
        
        .button-group {
            flex-direction: column-reverse;
        }
        
        .btn-delete,
        .btn-cancel {
            width: 100%;
        }
    }
</style>

<div class="delete-container">
    <div class="delete-card">
        <div class="warning-icon">⚠</div>
        
        <h1 class="delete-title">削除の確認</h1>
        
        <p class="plan-name">{{ object.title }}</p>
        
        <p class="warning-text">この操作は取り消すことができません</p>
        
        <form method="post" id="deleteForm">
            {% csrf_token %}
            <div class="button-group">
                <a href="{% url 'kickboxing_app:plan_detail' object.pk %}" class="btn-cancel">
                    キャンセル
                </a>
                
                <button type="submit" class="btn-delete">
                    <span>削除する</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ローディング画面 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text loading-dots">削除中</p>
    </div>
</div>

<script>
document.getElementById('deleteForm').addEventListener('submit', function(e) {
    // ローディング画面を表示
    document.getElementById('loadingOverlay').classList.add('active');
    
    // 1秒後にフォームを実際に送信
    e.preventDefault();
    setTimeout(() => {
        this.submit();
    }, 1000);
});
</script>
{% endblock %}
